name: publish-deployment-images

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to authorize GHCR publication
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: inputs.confirm == 'PUBLISH'
    environment: production
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: web
            target: runner
          - component: worker
            target: worker
          - component: signer
            target: signer
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            AGENTTRIAL_BUILD_COMMIT=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agenttrial-${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/agenttrial-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
